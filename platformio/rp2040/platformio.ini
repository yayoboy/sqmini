[env:pico]
platform = raspberrypi
board = pico
framework = arduino

build_flags =
    -DSQLITE_PLATFORM_RP2040
    -DSQLITE_OMIT_LOAD_EXTENSION
    -DSQLITE_THREADSAFE=1
    -DSQLITE_DEFAULT_PAGE_SIZE=512
    -DSQLITE_DEFAULT_CACHE_SIZE=-32
    -DSQLITE_TEMP_STORE=3
    -DSQLITE_ENABLE_CUSTOM_VFS=1
    -I../../include
    -I../../src

lib_deps =
    adafruit/Adafruit LittleFS@^2.1.0

monitor_speed = 115200
upload_speed = 921600

[env:pico-littlefs]
extends = env:pico
build_flags =
    ${env:pico.build_flags}
    -DUSE_LITTLEFS

[env:pico-sdcard]
extends = env:pico
build_flags =
    ${env:pico.build_flags}
    -DUSE_SDCARD
lib_deps =
    ${env:pico.lib_deps}
    SdFat
