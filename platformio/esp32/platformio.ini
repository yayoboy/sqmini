[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

build_flags =
    -DSQLITE_PLATFORM_ESP32
    -DSQLITE_OMIT_LOAD_EXTENSION
    -DSQLITE_THREADSAFE=1
    -DSQLITE_DEFAULT_PAGE_SIZE=512
    -DSQLITE_DEFAULT_CACHE_SIZE=-64
    -DSQLITE_TEMP_STORE=3
    -DSQLITE_ENABLE_CUSTOM_VFS=1
    -I../../include
    -I../../src

lib_deps =
    ESP32 LittleFS

monitor_speed = 115200
upload_speed = 921600

[env:esp32-spiffs]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DUSE_SPIFFS

[env:esp32-littlefs]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DUSE_LITTLEFS

[env:esp32-sdcard]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DUSE_SDCARD
